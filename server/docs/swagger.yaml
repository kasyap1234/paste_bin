basePath: /
definitions:
  models.Analytics:
    properties:
      created_at:
        type: string
      id:
        type: string
      paste_id:
        type: string
      updated_at:
        type: string
      url:
        type: string
      views:
        type: integer
    type: object
  models.AnalyticsInput:
    properties:
      paste_id:
        type: string
      url:
        type: string
    type: object
  models.LoginInput:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  models.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  models.PaginatedPastesResponse:
    properties:
      has_more:
        type: boolean
      limit:
        type: integer
      offset:
        type: integer
      pastes:
        items:
          $ref: '#/definitions/models.PasteOutput'
        type: array
      total:
        type: integer
    type: object
  models.PasteInput:
    properties:
      content:
        type: string
      expires_at:
        type: string
      expires_in:
        type: string
      language:
        type: string
      password:
        type: string
      title:
        type: string
    type: object
  models.PasteOutput:
    properties:
      content:
        type: string
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      is_private:
        type: boolean
      language:
        type: string
      title:
        type: string
      updated_at:
        type: string
      url:
        type: string
      user_id:
        type: string
      views:
        type: integer
    type: object
  models.PatchPaste:
    properties:
      content:
        type: string
      expires_at:
        type: string
      id:
        type: string
      is_private:
        type: boolean
      language:
        type: string
      password:
        type: string
      title:
        type: string
      user_id:
        type: string
    type: object
  models.PatchProfile:
    properties:
      avatar:
        type: string
      name:
        type: string
    type: object
  models.RegisterInput:
    properties:
      email:
        type: string
      name:
        minLength: 2
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
  models.User:
    properties:
      avatar:
        type: string
      email:
        type: string
      id:
        type: string
      is_verified:
        type: boolean
      name:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: A simple pastebin service with analytics
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Pastebin API
  version: "1.0"
paths:
  /analytics:
    get:
      consumes:
      - application/json
      description: Retrieve all analytics with pagination
      parameters:
      - description: Sort order
        in: query
        name: order
        type: string
      - description: Limit number of results
        in: query
        name: limit
        type: integer
      - description: Offset for pagination
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of analytics
          schema:
            items:
              $ref: '#/definitions/models.Analytics'
            type: array
        "400":
          description: Invalid parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Unable to get analytics
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get all analytics
      tags:
      - analytics
  /analytics/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve specific analytics entry by its ID
      parameters:
      - description: Analytics ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Analytics data
          schema:
            $ref: '#/definitions/models.Analytics'
        "400":
          description: Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Unable to get analytics
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get analytics by ID
      tags:
      - analytics
  /analytics/paste:
    get:
      consumes:
      - application/json
      description: Retrieve analytics for a specific paste
      parameters:
      - description: Paste ID
        in: query
        name: pasteID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Analytics data
          schema:
            $ref: '#/definitions/models.Analytics'
        "400":
          description: Invalid paste ID
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Unable to get analytics
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get analytics by paste ID
      tags:
      - analytics
  /analytics/user:
    get:
      consumes:
      - application/json
      description: Retrieve analytics for a specific user with pagination
      parameters:
      - description: User ID
        in: query
        name: userID
        required: true
        type: string
      - description: Sort order
        in: query
        name: order
        type: string
      - description: Limit number of results
        in: query
        name: limit
        type: integer
      - description: Offset for pagination
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of analytics
          schema:
            items:
              $ref: '#/definitions/models.Analytics'
            type: array
        "400":
          description: Invalid parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Unable to get analytics
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get analytics by user
      tags:
      - analytics
  /create-analytics:
    post:
      consumes:
      - application/json
      description: Create a new analytics entry for a paste
      parameters:
      - description: Analytics data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.AnalyticsInput'
      produces:
      - application/json
      responses:
        "201":
          description: Analytics created successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Unable to create analytics
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create analytics entry
      tags:
      - analytics
  /forgot-password:
    post:
      consumes:
      - application/json
      description: Send a password reset link to the user's email
      parameters:
      - description: Email payload
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Reset link sent if email exists
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request password reset
      tags:
      - auth
  /login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: User login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/models.LoginResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - auth
  /p/{slug}:
    get:
      consumes:
      - application/json
      description: Retrieve a public paste by its URL slug
      parameters:
      - description: Paste slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paste data
          schema:
            $ref: '#/definitions/models.PasteOutput'
        "400":
          description: Invalid slug
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Paste not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Unable to get paste
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get public paste by slug
      tags:
      - pastes
  /paste:
    post:
      consumes:
      - application/json
      description: Create a new paste with optional expiration
      parameters:
      - description: Paste data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.PasteInput'
      - description: Expiration duration (e.g., '24h', '7d')
        in: query
        name: expires_in
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created paste with shareable URL
          schema:
            $ref: '#/definitions/models.PasteOutput'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Unable to create paste
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a new paste
      tags:
      - pastes
  /paste/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a specific paste by its ID
      parameters:
      - description: Paste ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paste deleted successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid paste ID
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Unable to delete paste
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete paste by ID
      tags:
      - pastes
    get:
      consumes:
      - application/json
      description: Retrieve a specific paste by its ID. Password required for password-protected
        pastes if user is not the owner.
      parameters:
      - description: Paste ID
        in: path
        name: id
        required: true
        type: string
      - description: Password for password-protected pastes
        in: query
        name: password
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paste data
          schema:
            $ref: '#/definitions/models.PasteOutput'
        "400":
          description: Invalid paste ID or missing password
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid password
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Unable to get paste
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get paste by ID
      tags:
      - pastes
    put:
      consumes:
      - application/json
      description: Update an existing paste by ID
      parameters:
      - description: Paste ID
        in: path
        name: id
        required: true
        type: string
      - description: Paste update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.PatchPaste'
      produces:
      - application/json
      responses:
        "200":
          description: Paste updated successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Unable to update paste
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a paste
      tags:
      - pastes
  /paste/filter:
    get:
      consumes:
      - application/json
      description: Filter pastes by criteria
      parameters:
      - collectionFormat: csv
        description: Filter by languages
        in: query
        items:
          type: string
        name: languages
        type: array
      - description: Filter by start date (RFC3339)
        in: query
        name: date_from
        type: string
      - description: Filter by end date (RFC3339)
        in: query
        name: date_to
        type: string
      - description: Field to sort by
        in: query
        name: sort_by
        type: string
      - description: Sort order (asc or desc)
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Filtered pastes
          schema:
            items:
              $ref: '#/definitions/models.PasteOutput'
            type: array
        "400":
          description: Invalid request parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Unable to filter pastes
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Filter pastes
      tags:
      - pastes
  /pastes:
    get:
      consumes:
      - application/json
      description: Retrieve all pastes for the authenticated user with pagination
      parameters:
      - description: 'Number of pastes to return (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Number of pastes to skip (default: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of pastes
          schema:
            $ref: '#/definitions/models.PaginatedPastesResponse'
        "400":
          description: Invalid pagination parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Unable to get pastes
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get all pastes for user
      tags:
      - pastes
  /profile:
    get:
      consumes:
      - application/json
      description: Retrieve the profile of the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: Profile retrieved successfully
          schema:
            $ref: '#/definitions/models.User'
        "500":
          description: Failed to get profile
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - profile
    put:
      consumes:
      - application/json
      description: Update the profile of the authenticated user
      parameters:
      - description: Profile update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.PatchProfile'
      produces:
      - application/json
      responses:
        "200":
          description: Profile updated successfully
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to update profile
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - profile
  /raw/{slug}:
    get:
      consumes:
      - application/json
      description: Retrieve raw text content of a public paste by its URL slug
      parameters:
      - description: Paste slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Raw paste content
          schema:
            type: string
        "400":
          description: Invalid slug
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Paste not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Unable to get paste
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get raw paste content by slug
      tags:
      - pastes
  /register:
    post:
      consumes:
      - application/json
      description: Register a new user with email and password
      parameters:
      - description: User registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RegisterInput'
      produces:
      - application/json
      responses:
        "201":
          description: User registered successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to register
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /reset-password:
    post:
      consumes:
      - application/json
      description: Reset user's password with a valid reset token
      parameters:
      - description: Reset payload
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid or expired token
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reset password using token
      tags:
      - auth
  /verify-email/{token}:
    get:
      consumes:
      - application/json
      description: Verify user email using verification token
      parameters:
      - description: Verification token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Email verified successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid or expired token
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to verify email
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify user email
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
